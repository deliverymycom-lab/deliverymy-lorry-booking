<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeliveryMY - Offline Lorry Booking</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #F8F9FE; color: #1A1A2E; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
        .card { background: white; border-radius: 20px; padding: 28px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); max-width: 360px; width: 100%; border: 1px solid #E2E8F0; }
        .logo { font-size: 42px; margin-bottom: 12px; }
        h1 { color: #FF6B00; font-size: 24px; font-weight: 800; margin-bottom: 8px; }
        p { color: #64748B; font-size: 14px; line-height: 1.5; margin-bottom: 24px; }
        .btn { display: block; width: 100%; padding: 14px; background: linear-gradient(135deg, #FF6B00, #FF9100); color: white; text-decoration: none; border-radius: 14px; font-weight: 700; font-size: 15px; border: none; cursor: pointer; box-shadow: 0 4px 14px rgba(255,107,0,0.3); }
        .badge { display: inline-block; background: #FFF3E0; color: #E65100; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🚛</div>
        <span class="badge">Standalone Android APK</span>
        <h1>DeliveryMY</h1>
        <p>Aplikasi tempahan lori terus antara pelanggan & pemandu di seluruh Semenanjung Malaysia (Direct Deal • 0% Komisen).</p>
        <button class="btn" onclick="window.location.reload()">Muat Semula Aplikasi</button>
    </div>
</body>
</html>
